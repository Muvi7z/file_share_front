plugins {
    id "com.android.application"
}

android {
    namespace "com.localvideovault.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.localvideovault.mobile"
        minSdk 24
        targetSdk 35
        versionCode 30
        versionName "1.0.3"
    }

    signingConfigs {
        tvRelease {
            storeFile file("../tv-release.keystore")
            storePassword "localvault"
            keyAlias "localvault"
            keyPassword "localvault"
            enableV1Signing true
            enableV2Signing true
        }
    }

    flavorDimensions "target"

    productFlavors {
        working {
            dimension "target"
            applicationId "com.localvideovault.mobile"
            minSdk 24
            targetSdk 35
            versionCode 30
            versionName "1.0.3-working"
        }

        tv9 {
            dimension "target"
            applicationId "com.localvideovault.mobile"
            minSdk 21
            targetSdk 28
            versionCode 31
            versionName "1.0.3-tv9"
        }

        fresh {
            dimension "target"
            applicationId "com.localvideovault.tv9fresh"
            minSdk 21
            targetSdk 28
            versionCode 1
            versionName "1.0.3-tv9-fresh"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.tvRelease
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        disable "ExpiredTargetSdkVersion"
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.5.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
